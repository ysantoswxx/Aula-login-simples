<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #121212;
            display: flex;
            flex-direction: column; /* Alinha os elementos em coluna */
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #F9FAFB;
        }

        /* Criamos uma área que engloba o formulário e o link abaixo dele */
        h1 {
            color: #FDE68A;
            margin-bottom: 20px;
        }

        form {
            background: #1E1E1E;
            padding: 40px;
            width: 350px;
            border-radius: 20px 20px 0 0; /* Arredonda apenas o topo */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: #2A2A2A;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FDE68A;
            color: #121212;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #FEF3C7;
        }

        /* Estilizando o link para parecer que faz parte do bloco cinza */
        a {
            display: block;
            width: 350px; /* Mesma largura do formulário */
            background: #1E1E1E; /* Mesma cor do formulário */
            text-align: center;
            padding: 0 40px 30px 40px; /* Preenchimento para alinhar com o form */
            color: #FDE68A;
            text-decoration: none;
            font-size: 13px;
            border-radius: 0 0 20px 20px; /* Arredonda apenas a base */
        }

        a:hover {
            text-decoration: underline;
        }

        /* Esconde os <br> extras para não quebrar o layout */
        body > br {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Cadastro</h1>

    <form action="/cadastro" method="post">
        Email: <input type="email" name="email">
        <br><br>
        Senha: <input type="password" name="senha">
        <br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <br>
    <a href="/login">Ja tenho conta</a>
    <a href="/tela_inical">Ja tenho conta</a>
    
</body>
</html>
